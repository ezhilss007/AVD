# Terraform workflow with an optional ODO deployment step for OpenShift.
# The workflow uses terraform.tfvars for root module variable values.

name: 'Terraform and ODO Deployment'

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -var-file=terraform.tfvars

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false -var-file=terraform.tfvars

  odo-deploy:
    name: 'ODO Deployment'
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ODO CLI
        run: |
          curl -L "https://github.com/openshift/odo/releases/download/v4.11.0/odo-linux-amd64" -o odo
          chmod +x odo
          sudo mv odo /usr/local/bin/odo

      - name: Login to OpenShift
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: odo login $OPENSHIFT_SERVER --token $OPENSHIFT_TOKEN --insecure-skip-tls-verify

      - name: Select OpenShift project
        run: |
          odo project create ${{ secrets.OPENSHIFT_PROJECT }} || true
          odo project set ${{ secrets.OPENSHIFT_PROJECT }}

      - name: Deploy application with odo
        run: odo push --context . --wait
